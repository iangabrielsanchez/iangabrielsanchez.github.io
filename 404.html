<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ian Gabriel Sanchez</title>
</head>
<body style="background:#000;">
  <script>
    // GitHub Pages has no server-side rewrites, so clean URLs like
    // /product/sim or /about fall through to this 404 page. We map
    // the path to the real static file, fetch its HTML, and swap it
    // in while keeping the pretty URL in the address bar.
    (function () {
      var path = location.pathname.replace(/\/+$/, '') || '/';

      var staticRoutes = {
        '/about': '/about.html',
        '/portfolio': '/portfolio.html',
        '/lab': '/lab.html',
        '/blog': '/blog.html',
        '/products': '/products.html'
      };

      var dynamicRoutes = [
        { prefix: '/portfolio/', file: '/portfolio-item.html' },
        { prefix: '/post/', file: '/post.html' },
        { prefix: '/product/', file: '/product.html' }
      ];

      var target = staticRoutes[path];

      if (!target) {
        for (var i = 0; i < dynamicRoutes.length; i++) {
          var route = dynamicRoutes[i];
          if (path.indexOf(route.prefix) === 0 && path.length > route.prefix.length) {
            target = route.file;
            break;
          }
        }
      }

      if (!target) {
        // No known route — leave the default 404 message in place.
        document.body.style.background = '#fff';
        document.body.innerHTML = '<div style="font-family:system-ui,sans-serif;padding:80px 40px;max-width:640px;">' +
          '<h1 style="font-size:28px;margin-bottom:12px;">Page not found</h1>' +
          '<p style="color:#666;">This page doesn\'t exist. <a href="/" style="color:#ff4500;">Go home →</a></p>' +
          '</div>';
        return;
      }

      fetch(target)
        .then(function (r) {
          if (!r.ok) throw new Error('not found');
          return r.text();
        })
        .then(function (html) {
          history.replaceState(null, '', path + location.search);
          document.open();
          document.write(html);
          document.close();
        })
        .catch(function () {
          document.body.style.background = '#fff';
          document.body.innerHTML = '<div style="font-family:system-ui,sans-serif;padding:80px 40px;max-width:640px;">' +
            '<h1 style="font-size:28px;margin-bottom:12px;">Page not found</h1>' +
            '<p style="color:#666;">This page doesn\'t exist. <a href="/" style="color:#ff4500;">Go home →</a></p>' +
            '</div>';
        });
    })();
  </script>
</body>
</html>
