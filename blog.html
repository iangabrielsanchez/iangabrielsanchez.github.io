  <!-- ── FILTER BAR ── -->
  <div class="border-b-3 border-black bg-white">
    <div id="filter-bar" class="px-10 py-5 flex flex-wrap items-center gap-2">
      <div class="text-[13px] text-gray-400">Loading filters…</div>
    </div>
  </div>

  <!-- ── NOTE LIST ── -->
  <div class="border-b-3 border-black">
    <div id="notes-list">
      <div class="px-10 py-8 text-[13px] text-gray-400">Loading…</div>
    </div>
  </div>

  <script>
    function badgeHTML(cat) {
      if (cat === 'Security') return `<span class="inline-block text-[9px] font-bold uppercase tracking-[.12em] bg-accent text-white px-2.5 py-1">${cat}</span>`;
      if (cat === 'Backend') return `<span class="inline-block text-[9px] font-bold uppercase tracking-[.12em] bg-black group-hover:bg-white text-white group-hover:text-black px-2.5 py-1">${cat}</span>`;
      return `<span class="inline-block text-[9px] font-bold uppercase tracking-[.12em] border border-gray-400 group-hover:border-white/40 text-gray-500 group-hover:text-white/70 px-2.5 py-1">${cat}</span>`;
    }

    function pillClass(active) {
      return active
        ? 'bg-black text-white border-black'
        : 'bg-white text-gray-600 border-gray-300 hover:border-black hover:text-black';
    }

    let allNotes = [];
    let activeFilter = new URLSearchParams(location.search).get('filter') || null;

    function renderList() {
      const filtered = activeFilter ? allNotes.filter(n => n.category === activeFilter) : allNotes;
      const list = document.getElementById('notes-list');

      if (!filtered.length) {
        const message = allNotes.length
          ? 'No posts match this filter.'
          : "Nothing published yet — check back soon.";
        list.innerHTML = `<div class="px-10 py-8 text-[13px] text-gray-400">${message}</div>`;
        return;
      }

      list.innerHTML = filtered.map((note, i) => `
        <a href="/post/${note.slug}" class="flex flex-col md:flex-row md:items-start gap-4 md:gap-10 px-10 py-8 ${i < filtered.length - 1 ? 'border-b-3 border-black' : ''} hover:bg-black hover:text-white transition-colors group">
          <div class="flex-shrink-0 w-28">
            ${badgeHTML(note.category)}
            <p class="text-[10px] text-gray-400 group-hover:text-white/50 mt-3 tracking-[.04em]">${note.date}</p>
          </div>
          <div class="flex-1">
            <h2 class="text-[18px] font-black uppercase tracking-[.01em] leading-snug mb-2">${note.title}</h2>
            <p class="text-[13px] text-gray-500 group-hover:text-white/70 leading-relaxed">${note.description}</p>
          </div>
          <span class="hidden md:block text-[18px] font-black group-hover:translate-x-1 transition-transform mt-1">→</span>
        </a>
      `).join('');
    }

    function renderFilters() {
      const categories = [...new Set(allNotes.map(n => n.category))].sort();
      const bar = document.getElementById('filter-bar');
      bar.innerHTML = `
        <button data-filter="" class="text-[10px] font-bold uppercase tracking-[.08em] px-3 py-1.5 border transition-colors ${pillClass(!activeFilter)}">All</button>
        <span class="w-px h-4 bg-gray-300 mx-1"></span>
        ${categories.map(c => `<button data-filter="${c}" class="text-[10px] font-bold uppercase tracking-[.08em] px-3 py-1.5 border transition-colors ${pillClass(activeFilter === c)}">${c}</button>`).join('')}
      `;

      bar.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', () => {
          activeFilter = btn.dataset.filter || null;
          const url = new URL(location);
          if (activeFilter) url.searchParams.set('filter', activeFilter);
          else url.searchParams.delete('filter');
          history.replaceState(null, '', url);
          renderFilters();
          renderList();
        });
      });
    }

    fetch('/content/post/index.json')
      .then(r => r.json())
      .then(notes => {
        allNotes = notes;
        renderFilters();
        renderList();
      })
      .catch(() => {
        document.getElementById('filter-bar').innerHTML = '';
        document.getElementById('notes-list').innerHTML = '<div class="px-10 py-8 text-[13px] text-gray-400">Could not load posts. Make sure you\'re running a local server.</div>';
      });
  </script>
