<body class="bg-white text-black font-sans min-h-screen flex flex-col">

  <main class="flex-1">

  <!-- ── META BAR ── -->

      <span id="meta-status" class="text-[9px] font-bold uppercase tracking-[.12em]"></span>

  <!-- ── TABS ── -->

      <button id="tab-overview" onclick="showTab('overview')"

      <button id="tab-changelog" onclick="showTab('changelog')"

  <!-- ── CONTENT + SIDEBAR ── -->
  <div class="border-b-3 border-black">

    <!-- Left: article -->

      <div id="panel-overview" class="px-10 py-14">
        <div id="content-overview" class="prose max-w-2xl">
          <div class="text-[13px] text-gray-400">Loading…</div>
        </div>
      </div>

      <div id="panel-changelog" class="px-10 py-14 hidden">
        <div id="content-changelog" class="prose max-w-2xl">
          <div class="text-[13px] text-gray-400">Loading…</div>
        </div>
      </div>
    </div>

    <!-- Right: meta -->
    <div class="flex flex-col divide-y-3 divide-black">
      <div class="px-8 py-8">
        <p class="text-[9px] font-bold text-accent uppercase tracking-widest2 mb-4">Status</p>

      </div>
      <div class="px-8 py-8">
        <p class="text-[9px] font-bold text-accent uppercase tracking-widest2 mb-4">Category</p>

      </div>
      <span class="text-[11px] text-white/40 tracking-[.04em]">© 2026 · Philippines</span>

  <script>
    function showTab(name) {
      ['overview', 'changelog'].forEach(t => {
        document.getElementById(`panel-${t}`).classList.toggle('hidden', t !== name);
        const btn = document.getElementById(`tab-${t}`);
        if (t === name) {
          btn.classList.add('bg-black', 'text-white');
          btn.classList.remove('text-gray-500');
        } else {
          btn.classList.remove('bg-black', 'text-white');
          btn.classList.add('text-gray-500');
        }
      });
      const params = new URLSearchParams(location.search);
      params.set('tab', name);
      history.replaceState(null, '', `${location.pathname}?${params}`);
    }

    const slug = decodeURIComponent(location.pathname.replace(/^\/product\/?/, ''));
    const params = new URLSearchParams(location.search);
    const tab = params.get('tab') || 'overview';

    if (!slug) {
      document.getElementById('content-overview').innerHTML = '<p>Product not found.</p>';
    } else {
      Promise.all([
        fetch(`/content/products/index.json`).then(r => r.json()),
        fetch(`/content/products/${slug}/index.md`).then(r => {
          if (!r.ok) throw new Error('not found');
          return r.text();
        }),
        fetch(`/content/products/${slug}/changelog.md`).then(r => {
          if (!r.ok) return '# Changelog\n\nNo changelog yet.';
          return r.text();
        })
      ]).then(([index, overviewMd, changelogMd]) => {
        const meta = index.find(p => p.slug === slug);

        if (meta) {
          document.title = `${meta.name} — Ian Gabriel Sanchez`;

          const pageUrl = `https://iangabrielsanchez.com/product/${meta.slug}`;
          const pageTitle = `${meta.name} — Ian Gabriel Sanchez`;
          document.getElementById('meta-description').setAttribute('content', meta.description);
          document.getElementById('meta-canonical').setAttribute('href', pageUrl);
          document.getElementById('meta-og-url').setAttribute('content', pageUrl);
          document.getElementById('meta-og-title').setAttribute('content', pageTitle);
          document.getElementById('meta-og-description').setAttribute('content', meta.description);
          document.getElementById('meta-twitter-title').setAttribute('content', pageTitle);
          document.getElementById('meta-twitter-description').setAttribute('content', meta.description);

          const statusEl = document.getElementById('meta-status');
          statusEl.textContent = meta.status;
          statusEl.classList.add(meta.status === 'Live' ? 'text-accent' : 'text-black');
          document.getElementById('meta-category').textContent = `${meta.category} · ${meta.year}`;

          const statusEl2 = document.getElementById('meta-status-2');
          statusEl2.textContent = meta.status;
          statusEl2.classList.add(meta.status === 'Live' ? 'text-accent' : 'text-black');
          document.getElementById('meta-category-2').textContent = `${meta.category} · ${meta.year}`;

          if (meta.tags && meta.tags.length) {
            const tagsBar = document.getElementById('tags-bar');
            tagsBar.classList.remove('hidden');
            document.getElementById('tags-list').innerHTML = meta.tags.map(t =>
              `<span class="text-[10px] text-gray-600 border border-gray-300 px-2.5 py-1 tracking-[.04em]">${t}</span>`
            ).join('');
          }

          if (meta.client) {
            const clientEl = document.getElementById('meta-client');
            clientEl.classList.remove('hidden');
            clientEl.classList.add('flex');
            const logoImg = `<img src="${meta.client.logo}" alt="${meta.client.name}" class="h-12 w-auto [filter:drop-shadow(0_0_0.5px_rgba(0,0,0,0.35))_drop-shadow(0_0_0.5px_rgba(0,0,0,0.35))]">`;
            clientEl.innerHTML = `
              <p class="text-[9px] font-bold text-accent uppercase tracking-widest2">Used By</p>
              ${meta.client.url
                ? `<a href="${meta.client.url}" target="_blank" rel="noopener" class="hover:opacity-70 transition-opacity">${logoImg}</a>`
                : logoImg}
            `;
          }
        }

        document.getElementById('content-overview').innerHTML = marked.parse(overviewMd);
        document.getElementById('content-changelog').innerHTML = marked.parse(changelogMd);
      }).catch(() => {
        document.getElementById('content-overview').innerHTML = '<p>Product not found.</p>';
      });

      if (tab === 'changelog') showTab('changelog');
    }
  </script>
